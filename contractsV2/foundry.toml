[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "@uniswap/v4-hooks-public/=lib/v4-hooks-public/",
  "permit2/=lib/v4-periphery/lib/permit2/",
  "forge-std/=lib/forge-std/src/",
]
# Tests deploy the full Uniswap V4 stack from its own build
# (script/setup-test-deps.sh clones and compiles it).
fs_permissions = [{ access = "read", path = "test-lib/v4-periphery/foundry-out" }]

